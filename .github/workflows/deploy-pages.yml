name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx vite build --base=/zedgehostwebsitenewui/

      - name: Prerender pages
        run: npx tsx scripts/prerender.ts

      - name: Rewrite root-absolute paths for the project Pages subpath
        run: |
          perl -pi -e 's{(?<!zedgehostwebsitenewui)/assets/}{/zedgehostwebsitenewui/assets/}g; s{(?<!zedgehostwebsitenewui)/index\.html}{/zedgehostwebsitenewui/index.html}g; s{href="/"}{href="/zedgehostwebsitenewui/"}g' $(find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \))
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
